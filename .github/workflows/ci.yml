name: ci
on:
  push: { branches: [main] }
  pull_request:
  workflow_dispatch:

# Source → Build → Test (backend, frontend, integration) → Package (GHCR) → Deploy → Health Check
env:
  REGISTRY_IMAGE: ghcr.io/${{ github.repository_owner }}/energonprime

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: uv run ruff check fuelops scripts tests
      - run: uv run mypy fuelops scripts
      - run: uv run lint-imports
      - run: uv run pytest tests -q
      - run: uv run pip-audit --strict || true   # report-only until triaged

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npx tsc -p tsconfig.json
      - run: npx vite build

  integration:
    needs: [backend, frontend]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
      - run: uv sync --frozen
      - run: docker compose up -d --build --wait
      - run: uv run python scripts/contract_smoke.py --out /tmp/p0-contract
      - run: uv run python scripts/e2e_smoke.py
      - name: Playwright UI smoke
        working-directory: frontend
        run: npm ci && npx playwright install --with-deps chromium && npx playwright test
      - name: k6 smoke
        uses: grafana/setup-k6-action@v1
      - run: k6 run -e PROFILE=smoke load/k6_api.js
      - if: always()
        run: docker compose logs --tail=200 api worker
      - if: always()
        run: docker compose down -v

  ci-success:
    needs: [backend, frontend, integration]
    runs-on: ubuntu-latest
    steps: [{ run: echo "all required checks passed" }]

  package:
    # Only a green main build is published; every image is tagged with its commit for rollback.
    needs: [ci-success]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions: { contents: read, packages: write }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Build and push images
        run: |
          IMG=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
          docker build -t $IMG/fuelops:${{ github.sha }} -t $IMG/fuelops:latest .
          docker build -t $IMG/web:${{ github.sha }} -t $IMG/web:latest frontend
          for t in fuelops:${{ github.sha }} fuelops:latest web:${{ github.sha }} web:latest; do docker push $IMG/$t; done

  deploy:
    # Deploys the published images (no local build) to a fresh environment and gates on health.
    needs: [package]
    runs-on: ubuntu-latest
    environment: demo
    permissions: { contents: read, packages: read }
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with: { registry: ghcr.io, username: "${{ github.actor }}", password: "${{ secrets.GITHUB_TOKEN }}" }
      - name: Deploy published images
        run: |
          IMG=$(echo "$REGISTRY_IMAGE" | tr '[:upper:]' '[:lower:]')
          export FUELOPS_IMAGE=$IMG/fuelops:${{ github.sha }} WEB_IMAGE=$IMG/web:${{ github.sha }}
          docker compose pull api worker web
          docker compose up -d --no-build --wait
      - name: Health check
        run: |
          for i in $(seq 1 30); do curl -fs localhost:8080/readyz && break; sleep 2; done
          curl -fs localhost:8080/readyz
          curl -fs localhost:3000/healthz
          curl -fs localhost:8080/api/v1/system/status | tee status.json
          python3 -c "import json;d=json.load(open('status.json'))['data'];print('overall',d['overall']);assert d['overall'] in ('healthy','degraded')"
      - if: always()
        run: docker compose logs --tail=100 api worker web
      - if: always()
        run: docker compose down -v
